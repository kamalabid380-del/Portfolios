<article class="group grid gap-6 sm:gap-8 md:grid-cols-5 md:items-center py-10 sm:py-14">
  <div class="min-w-0 md:col-span-2" data-reveal="left">
    <p class="text-[10px] tracking-[0.2em] text-gray-400 break-words">
      {% if project.tech %}{{ project.tech|upper }}{% endif %}{% if project.tech and project.year %} · {% endif %}{{ project.year }}
    </p>
    <h3 class="mt-3 text-2xl sm:text-3xl font-light break-words">
      <a href="{{ project.get_absolute_url }}">{{ project.title }}</a>
    </h3>
    <p class="mt-3 text-sm text-gray-500 leading-relaxed break-words">{{ project.summary }}</p>
    <a href="{{ project.get_absolute_url }}"
      class="mt-5 inline-block text-xs border-b border-gray-900 pb-0.5 arrow-move">View case study <span>→</span></a>
  </div>
  <a href="{{ project.get_absolute_url }}" class="block zoom-box bg-gray-100 md:col-span-3" data-reveal="right"
    style="--d: 120ms" aria-label="View the {{ project.title }} case study">
    {% if project.cover %}
    <img src="{{ project.cover_card_url }}" alt="{{ project.title }} — {{ project.summary }}" class="w-full h-auto"
      loading="lazy" decoding="async">
    {% else %}
    <div class="aspect-[16/10] flex items-center justify-center text-[10px] text-gray-400">NO IMAGE</div>
    {% endif %}
  </a>
</article>
