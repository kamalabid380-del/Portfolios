<article class="group card-lift" data-reveal>
  <a href="{{ project.get_absolute_url }}" class="block zoom-box bg-gray-100 aspect-[4/3]">
    {% if project.cover %}
      <img src="{{ project.cover.url }}" alt="{{ project.title }} — {{ project.summary }}"
           class="w-full h-full object-cover" loading="lazy" decoding="async">
    {% else %}
      <div class="w-full h-full flex items-center justify-center text-[10px] text-gray-400">NO IMAGE</div>
    {% endif %}
  </a>
  <div class="mt-5">
    <h3 class="text-lg font-light break-words">
      <a href="{{ project.get_absolute_url }}">{{ project.title }}</a>
    </h3>
    <p class="mt-1 text-[10px] tracking-[0.2em] text-gray-400 break-words">
      {% if project.tech %}{{ project.tech|upper }}{% endif %}{% if project.tech and project.year %} · {% endif %}{{ project.year }}
    </p>
    <p class="mt-3 text-sm text-gray-500 leading-relaxed break-words line-clamp-3">{{ project.summary }}</p>
    <a href="{{ project.get_absolute_url }}" class="mt-3 inline-block text-xs border-b border-gray-900 pb-0.5 arrow-move">View case study <span>→</span></a>
  </div>
</article>
