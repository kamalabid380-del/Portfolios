services:
  - type: web
    name: abidkamal-portfolio
    runtime: python
    plan: free
    region: singapore
    pythonVersion: "3.13"
    buildCommand: >-
      pip install -r requirements.txt
      && python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: abidkamal.com,www.abidkamal.com
