services:
  - type: web
    name: abidkamal-portfolio
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install -r requirements.txt
      && python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-10000} --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: abidkamal.com,www.abidkamal.com
